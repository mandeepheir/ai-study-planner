<div class="login-container">

    <h1>Login</h1>

    <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
    >

    <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
    >

    <button (click)="login()">
        Login
    </button>

    @if (message) {

        <p class="success">
            {{ message }}
        </p>

    }

    @if (errorMessage) {

        <p class="error">
            {{ errorMessage }}
        </p>

    }

</div>
